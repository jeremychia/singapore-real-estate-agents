version: 2

models:
  - name: dim_agents
    columns:
      - name: agent_registration_number
        data_tests:
          - not_null
          - unique
  - name: dim_agencies
    columns:
      - name: agency_license_number
        data_tests:
          - not_null
          - unique
  - name: dim_agents_agencies_scd
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - agency_license_number
            - agent_registration_number