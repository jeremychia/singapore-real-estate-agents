[project]
name = "extract-from-cea-website"
version = "0.1.0"
description = "Extract Singapore real estate agent data from CEA website"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pandas-gbq>=0.20.0",
    "requests>=2.31.0",
    "google-auth>=2.0.0",
    "curl-cffi>=0.14.0",
    "tqdm>=4.67.3",
]

[project.scripts]
cea-scraper = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extract", "load"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
